version: '3.8'

services:
  # Tu aplicación de FastAPI (igualita a la tuya pero sin Redis)
  api:
    build: 
      context: .
      dockerfile: Dockerfile.api
    container_name: mlops_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - LOG_LEVEL=DEBUG

  # Tu nuevo "pizarrón" para MLOps (JupyterLab)
  lab:
    build: 
      context: .
      dockerfile: Dockerfile.lab
    container_name: mlops_jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/app/notebooks
      - ./data:/app/data

